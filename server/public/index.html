<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<title>Mix Streamer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2333d17a'/></svg>">
<style>
  :root {
    --bg: #0e1014; --panel: #161a21; --panel2: #1d222b; --line: #262c37;
    --text: #e7eaf0; --dim: #8a93a3; --accent: #33d17a; --warn: #f5c044; --err: #ff5d5d;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  main { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 32px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 17px; font-weight: 650; letter-spacing: .02em; margin: 0; }
  h1 span { color: var(--accent); }
  .pill { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--dim);
    background: var(--panel); border: 1px solid var(--line); padding: 5px 11px; border-radius: 99px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); }
  .dot.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.wait { background: var(--warn); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
  .player { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 30px 20px; }
  #play { width: 128px; height: 128px; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #43e08b, #22a75d); color: #06210f;
    box-shadow: 0 10px 40px rgba(51,209,122,.25); display: grid; place-items: center; transition: transform .1s, filter .2s; }
  #play:active { transform: scale(.96); }
  #play.stop { background: radial-gradient(circle at 35% 30%, #3a414d, #262c36); color: var(--text); box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  #play svg { width: 48px; height: 48px; }
  #msg { color: var(--dim); font-size: 14px; min-height: 20px; text-align: center; }

  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin-bottom: 10px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel2); border-radius: 10px; padding: 4px; gap: 4px; }
  .seg button { border: none; background: transparent; color: var(--dim); padding: 10px 4px; border-radius: 7px;
    font: inherit; font-size: 14px; cursor: pointer; }
  .seg button small { display: block; font-size: 11px; opacity: .7; }
  .seg button.active { background: #2b323e; color: var(--text); }

  canvas { width: 100%; height: 74px; display: block; }
  .scale { display: flex; justify-content: space-between; font-size: 10px; color: var(--dim); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .readout { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 8px; font-variant-numeric: tabular-nums; }

  .info { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .info div { background: var(--panel2); border-radius: 10px; padding: 10px 12px; }
  .info b { display: block; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .info span { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  footer { text-align: center; color: #555d6b; font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>MIX<span>·</span>STREAMER</h1>
    <div class="pill"><i class="dot" id="srcDot"></i><span id="srcText">Connecting…</span></div>
  </header>

  <section class="card player">
    <button id="play" aria-label="Play">
      <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
      <svg id="icoStop" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg>
    </button>
    <div id="msg">Press play to listen</div>
  </section>

  <section class="card">
    <div class="label">Jitter buffer / latency</div>
    <div class="seg" id="latency">
      <button data-ms="100">Low<small>100 ms</small></button>
      <button data-ms="250" class="active">Medium<small>250 ms</small></button>
      <button data-ms="500">High<small>500 ms</small></button>
    </div>
  </section>

  <section class="card">
    <div class="label">Level (dBFS) — bar: RMS, line: peak</div>
    <canvas id="meter"></canvas>
    <div class="scale"><span>-60</span><span>-50</span><span>-40</span><span>-30</span><span>-20</span><span>-10</span><span>0</span></div>
    <div class="readout"><span id="pkL">L —</span><span id="pkR">R —</span></div>
  </section>

  <section class="card info">
    <div><span>Sample rate</span><b id="sr">—</b></div>
    <div><span>Bit depth</span><b id="bd">—</b></div>
    <div><span>Buffer</span><b id="fill">—</b></div>
    <div><span>Dropouts</span><b id="xr">0</b></div>
  </section>

  <footer>Uncompressed PCM · Web Audio</footer>
</main>
<script src="app.js"></script>
</body>
</html>
