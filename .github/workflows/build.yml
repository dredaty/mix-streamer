name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]          # README changes don't need a build
  workflow_dispatch:

# a newer push cancels the build still running for an older one (saves minutes)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARED_VERSION: "2026.10.7"

jobs:
  plugin:
    name: VST3 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: SamovStreamer-VST3-Windows-x64
            installer: SamovStreamer-Setup-Windows
            configure: cmake -B build -A x64 -DMIXSTREAMER_BUILD_TESTS=ON
            test: build/MixStreamerHeadlessTest_artefacts/Release/MixStreamerHeadlessTest.exe
          - name: macOS Universal
            os: macos-latest
            artifact: SamovStreamer-VST3-macOS-Universal
            installer: SamovStreamer-Installer-macOS
            configure: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DMIXSTREAMER_BUILD_TESTS=ON
            test: build/MixStreamerHeadlessTest_artefacts/Release/MixStreamerHeadlessTest
    defaults:
      run:
        working-directory: plugin
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure (downloads JUCE)
        run: ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Headless end-to-end test
        env:
          MIXSTREAMER_NO_TUNNEL: "1"
        run: ${{ matrix.test }}

      - name: Bundle cloudflared (Windows)
        if: runner.os == 'Windows'
        run: |
          RES="build/MixStreamer_artefacts/Release/VST3/Samov Streamer.vst3/Contents/Resources"
          mkdir -p "$RES"
          curl -fsSL -o "$RES/cloudflared.exe" \
            "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-windows-amd64.exe"
          ls -la "$RES"

      - name: Bundle cloudflared (macOS universal) + ad-hoc sign
        if: runner.os == 'macOS'
        run: |
          BUNDLE="build/MixStreamer_artefacts/Release/VST3/Samov Streamer.vst3"
          RES="$BUNDLE/Contents/Resources"
          mkdir -p "$RES" cf
          for a in arm64 amd64; do
            curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-darwin-$a.tgz" | tar -xz -C cf
            mv cf/cloudflared "cf/cloudflared-$a"
          done
          lipo -create cf/cloudflared-arm64 cf/cloudflared-amd64 -output "$RES/cloudflared"
          chmod +x "$RES/cloudflared"
          codesign --force --sign - "$RES/cloudflared"
          codesign --force --deep --sign - "$BUNDLE"
          lipo -info "$BUNDLE/Contents/MacOS/Samov Streamer" "$RES/cloudflared"
          codesign --verify --deep --strict "$BUNDLE"

      - name: Read version
        run: echo "APP_VERSION=$(sed -nE 's/^project\(MixStreamer VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"

      - name: Build installer (Windows, Inno Setup)
        if: runner.os == 'Windows'
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$ISCC" ]; then choco install innosetup -y --no-progress; fi
          SRC=$(cygpath -w "$PWD/build/MixStreamer_artefacts/Release/VST3/Samov Streamer.vst3")
          "$ISCC" /Q "/DAppVersion=$APP_VERSION" "/DSourceDir=$SRC" "$(cygpath -w ../installer/windows/SamovStreamer.iss)"
          mkdir -p ../dist && mv ../installer/windows/output/*.exe ../dist/
          ls -la ../dist

      - name: Build installer (macOS, pkg)
        if: runner.os == 'macOS'
        run: |
          ../installer/macos/build-pkg.sh "build/MixStreamer_artefacts/Release/VST3/Samov Streamer.vst3" "$APP_VERSION" ../dist
          ls -la ../dist

      # Only the installers are uploaded (the .vst3 is inside), kept 30 days:
      # the free plan has 500 MB of artifact storage.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.installer }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
