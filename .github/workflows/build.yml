name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CLOUDFLARED_VERSION: "2026.10.7"

jobs:
  plugin:
    name: VST3 (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: SamovStreamer-VST3-Windows-x64
            configure: cmake -B build -A x64 -DMIXSTREAMER_BUILD_TESTS=ON
            test: build/MixStreamerHeadlessTest_artefacts/Release/MixStreamerHeadlessTest.exe
          - name: macOS Universal
            os: macos-latest
            artifact: SamovStreamer-VST3-macOS-Universal
            configure: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DMIXSTREAMER_BUILD_TESTS=ON
            test: build/MixStreamerHeadlessTest_artefacts/Release/MixStreamerHeadlessTest
    defaults:
      run:
        working-directory: plugin
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Configure (downloads JUCE)
        run: ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Headless end-to-end test
        env:
          MIXSTREAMER_NO_TUNNEL: "1"
        run: ${{ matrix.test }}

      - name: Bundle cloudflared (Windows)
        if: runner.os == 'Windows'
        run: |
          RES="build/MixStreamer_artefacts/Release/VST3/Samov Streamer.vst3/Contents/Resources"
          mkdir -p "$RES"
          curl -fsSL -o "$RES/cloudflared.exe" \
            "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-windows-amd64.exe"
          ls -la "$RES"

      - name: Bundle cloudflared (macOS universal) + ad-hoc sign
        if: runner.os == 'macOS'
        run: |
          BUNDLE="build/MixStreamer_artefacts/Release/VST3/Samov Streamer.vst3"
          RES="$BUNDLE/Contents/Resources"
          mkdir -p "$RES" cf
          for a in arm64 amd64; do
            curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/$CLOUDFLARED_VERSION/cloudflared-darwin-$a.tgz" | tar -xz -C cf
            mv cf/cloudflared "cf/cloudflared-$a"
          done
          lipo -create cf/cloudflared-arm64 cf/cloudflared-amd64 -output "$RES/cloudflared"
          chmod +x "$RES/cloudflared"
          codesign --force --sign - "$RES/cloudflared"
          codesign --force --deep --sign - "$BUNDLE"
          lipo -info "$BUNDLE/Contents/MacOS/Samov Streamer" "$RES/cloudflared"
          codesign --verify --deep --strict "$BUNDLE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: plugin/build/MixStreamer_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
